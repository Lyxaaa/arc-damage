# ARC damage visualiser - paste into Portainer (Stacks > Add stack > Web editor). No image build needed.
# Host layout (create with scripts/package-for-host.sh, then copy to the home server):
#   /opt/docker/arc-damage/app    built web app (contents of web/dist, without arcs)
#   /opt/docker/arc-damage/arcs   game-derived ARC data (from web/public/arcs) - copied manually, private
# Then open http://<host>:8080/?arc=HeavyDroneMissile
services:
  viewer:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - /opt/docker/arc-damage/app:/usr/share/nginx/html:ro
      - /opt/docker/arc-damage/arcs:/data/arcs:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'CONF'
        server {
          listen 80;
          root /usr/share/nginx/html;
          index index.html;
          gzip on;
          gzip_types application/json model/gltf-binary application/octet-stream;
          location /arcs/ { alias /data/arcs/; add_header Cache-Control "no-cache"; }
          location / { try_files $$uri /index.html; }
        }
        CONF
        exec nginx -g 'daemon off;'
    restart: unless-stopped
