# ARC damage visualiser - paste into Portainer (Stacks > Add stack > Web editor) and deploy.
# On start, the container clones the repo from GitHub, builds the web app and serves it with nginx.
# The only manual step is copying the game-derived ARC data (private, not in git) to the host:
#   /opt/docker/arc-damage/arcs   <- contents of web/public/arcs (or deploy/arcs from scripts/package-for-host.sh)
#
# Port ${PORT:-7707} is also published on the host for direct access (http://<host>:7707/). The container joins the external 'lyxaa-cloud' network, where your existing
# NGINX (mahon.dev) reaches it as http://arc-damage:80. Add a server/location there, e.g.:
#   server { server_name arc.mahon.dev; location / { proxy_pass http://arc-damage:80; } }
# (use a variable + resolver if nginx should start even when this container is down)
#
# To update the app: restart/recreate the container (it pulls and rebuilds). First start takes a few minutes.
# Optional stack environment variables:
#   GIT_REPO    default https://github.com/Lyxaaa/arc-damage.git
#   GIT_BRANCH  default main
#   GIT_TOKEN   only needed if the repo is private (GitHub personal access token with read access)
services:
  viewer:
    image: node:22-alpine
    container_name: arc-damage
    ports:
      - "${PORT:-7707}:80"
    networks:
      - lyxaa-cloud
    environment:
      GIT_REPO: ${GIT_REPO:-https://github.com/Lyxaaa/arc-damage.git}
      GIT_BRANCH: ${GIT_BRANCH:-main}
      GIT_TOKEN: ${GIT_TOKEN:-}
    volumes:
      - /opt/docker/arc-damage/arcs:/data/arcs:ro
      - npm-cache:/root/.npm
    entrypoint:
      - /bin/sh
      - -euc
      - |
        apk add --no-cache git nginx >/dev/null
        url="$$GIT_REPO"
        if [ -n "$$GIT_TOKEN" ]; then url="$$(echo "$$GIT_REPO" | sed "s#https://#https://x-access-token:$$GIT_TOKEN@#")"; fi
        rm -rf /build && git clone --depth 1 --branch "$$GIT_BRANCH" "$$url" /build
        cd /build/web
        npm ci --no-audit --no-fund
        npx vite build
        mkdir -p /usr/share/nginx/html
        cp -r dist/. /usr/share/nginx/html/
        rm -rf /usr/share/nginx/html/arcs
        rm -rf /build
        if [ -z "$$(ls -A /data/arcs 2>/dev/null)" ]; then echo "WARNING: /data/arcs is empty - copy the ARC data to /opt/docker/arc-damage/arcs on the host"; fi
        mkdir -p /etc/nginx/http.d /run/nginx
        cat > /etc/nginx/http.d/default.conf <<'CONF'
        server {
          listen 80;
          root /usr/share/nginx/html;
          index index.html;
          gzip on;
          gzip_types application/json model/gltf-binary application/octet-stream;
          location /arcs/ { alias /data/arcs/; add_header Cache-Control "no-cache"; }
          location / { try_files $$uri /index.html; }
        }
        CONF
        exec nginx -g 'daemon off;'
    restart: unless-stopped

networks:
  lyxaa-cloud:
    external: true

volumes:
  npm-cache:
