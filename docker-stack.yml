# ARC damage visualiser - paste into Portainer (Stacks > Add stack > Web editor) and deploy.
# On start, the container clones the repo from GitHub, builds the web app and serves it with nginx.
# The only manual step is copying the game-derived ARC data (private, not in git) to the host:
#   /opt/docker/arc-damage/arcs   <- contents of web/public/arcs (or deploy/arcs from scripts/package-for-host.sh)
#
# Served directly on the host at http://<host>:7707/ (change with the PORT variable). Put it behind a domain in your own proxy.
#
# To update the app: restart/recreate the container (it pulls and rebuilds). First start takes a few minutes.
# Optional stack environment variables:
#   GIT_REPO    default https://github.com/Lyxaaa/arc-damage.git
#   GIT_BRANCH  default main
#   GIT_TOKEN   only needed if the repo is private (GitHub personal access token with read access)
services:
  viewer:
    image: node:22-alpine
    container_name: arc-damage
    ports:
      - "${PORT:-7707}:80"
    environment:
      GIT_REPO: ${GIT_REPO:-https://github.com/Lyxaaa/arc-damage.git}
      GIT_BRANCH: ${GIT_BRANCH:-main}
      GIT_TOKEN: ${GIT_TOKEN:-}
    volumes:
      - /opt/docker/arc-damage/arcs:/data/arcs:ro
      - npm-cache:/root/.npm
    entrypoint:
      - /bin/sh
      - -uc
      - |
        # nginx comes up first, so the URL always answers: a status page while building, the app afterwards.
        export GIT_TERMINAL_PROMPT=0
        echo "[arc] installing nginx + git"
        apk add --no-cache git nginx || exit 1
        mkdir -p /etc/nginx/http.d /run/nginx /usr/share/nginx/html /tmp/status
        cat > /etc/nginx/http.d/default.conf <<'CONF'
        server {
          listen 80;
          root /usr/share/nginx/html;
          index index.html;
          gzip on;
          gzip_types application/json model/gltf-binary application/octet-stream;
          location /arcs/ { alias /data/arcs/; add_header Cache-Control "no-cache"; }
          location / { try_files $$uri /index.html; }
        }
        CONF
        echo "<h3>ARC viewer: building, refresh in a few minutes. Follow the container logs.</h3>" > /usr/share/nginx/html/index.html
        nginx
        echo "[arc] nginx up on :80, building app"
        build() {
          set -eu
          url="$$GIT_REPO"
          if [ -n "$$GIT_TOKEN" ]; then url="$$(echo "$$GIT_REPO" | sed "s#https://#https://x-access-token:$$GIT_TOKEN@#")"; fi
          rm -rf /build
          git clone --depth 1 --branch "$$GIT_BRANCH" "$$url" /build
          cd /build/web
          npm ci --no-audit --no-fund
          npx vite build
          rm -rf /build/web/dist/arcs
          rm -rf /usr/share/nginx/html/*
          cp -r dist/. /usr/share/nginx/html/
          cd / && rm -rf /build
        }
        if (build) 2>&1; then
          echo "[arc] build OK - serving"
        else
          echo "[arc] BUILD FAILED (see above). If the clone failed, the repo may be private: set GIT_TOKEN."
          echo "<h3>ARC viewer: build failed. See the container logs.</h3>" > /usr/share/nginx/html/index.html
        fi
        if [ -z "$$(ls -A /data/arcs 2>/dev/null)" ]; then echo "[arc] WARNING: /data/arcs is empty - copy the ARC data to /opt/docker/arc-damage/arcs on the host"; fi
        # keep the container alive and surface nginx errors in the logs
        exec tail -f /var/log/nginx/error.log /var/log/nginx/access.log
    restart: unless-stopped

volumes:
  npm-cache:
